<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>머니 게임</title>
<meta name="description" content="머니 게임(Money Game) — 돈 합치기 퍼즐 게임의 정책·안내 페이지입니다.">
<style>
  :root { --bg:#f7f9fc; --card:#fff; --fg:#2c3242; --muted:#6b7480; --line:#e3e8f0; --accent:#5fa8e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a22; --card:#1e2430; --fg:#e6e9f0; --muted:#9aa3b2; --line:#2c3442; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 18px; background:var(--bg); color:var(--fg);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    line-height:1.7; word-break:keep-all;
  }
  main { max-width:520px; width:100%; text-align:center; background:var(--card);
         border:1px solid var(--line); border-radius:14px; padding:40px 24px; }
  .logo { font-size:52px; line-height:1; }
  h1 { font-size:26px; margin:12px 0 6px; }
  p { color:var(--muted); font-size:15px; margin:0 0 24px; }
  .links { display:flex; flex-direction:column; gap:10px; }
  a.btn {
    display:block; padding:12px 18px; border:1px solid var(--line); border-radius:10px;
    text-decoration:none; color:var(--fg); font-weight:700; font-size:15px;
  }
  a.btn:hover { border-color:var(--accent); color:var(--accent); }
  .foot { margin-top:22px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo">💰</div>
  <h1>머니 게임</h1>
  <p>같은 돈끼리 부딪히면 더 큰 돈이 되는 돈 합치기 퍼즐 게임입니다.<br>
     앱인토스와 Google Play에서 즐길 수 있어요.</p>
  <div class="links">
    <a class="btn" href="privacy.html">개인정보처리방침</a>
    <a class="btn" href="refund.html">구매 및 환불 안내</a>
    <a class="btn" href="https://github.com/tngus842655/MoneyGame" target="_blank" rel="noopener">GitHub 저장소</a>
  </div>
  <p class="foot">문의: tngus842655@gmail.com</p>
</main>
</body>
</html>
