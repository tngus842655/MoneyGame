<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>머니 게임</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* 전체화면(투명 내비게이션 바) 대응: 상태바/홈 인디케이터 안전 영역.
     기본값은 env() — 토스 안에서는 js/toss-safearea.js가 SDK 값으로 덮어씀 */
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --pill: 0px; /* 토스 네이티브 더보기(⋯)·닫기(X) 버튼을 피하는 우상단 여백 */
  }
  body.in-toss { --pill: 52px; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:#9fc6e8;
    display:flex; align-items:center; justify-content:center;
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
    font-family:"Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  #wrap { display:flex; flex-direction:column; align-items:center; }
  #gameArea { position:relative; line-height:0; }
  canvas { display:block; touch-action:none; border-radius:12px 12px 0 0; box-shadow:0 10px 40px rgba(30,60,100,.35); }

  /* banner ad slot */
  #adBanner {
    height:60px; margin-top:2px; border-radius:0 0 12px 12px;
    background:#252a36; color:#8a93ab; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; box-shadow:0 10px 40px rgba(30,60,100,.35);
  }
  /* 토스 실배너 부착 시: 화면 너비 100% + 고정형 96px (앱인토스 문서 규격) */
  body.toss-banner #adBanner {
    width:100vw !important; height:96px; display:block;
    border-radius:0; background:transparent; box-shadow:none; letter-spacing:0;
  }

  /* floating buttons */
  #hud, #hudR { position:absolute; display:flex; flex-direction:column; gap:8px; line-height:normal; }
  #hud  { top:10px; left:10px; }
  #hudR { top:88px; right:10px; }
  /* 토스 안: '다음' 미리보기가 네이티브 ⋯/X 버튼을 피해 내려오므로(game.js) 그 아래로 */
  body.in-toss #hudR { top:136px; }
  #hud button, #hudR button {
    position:relative; width:38px; height:38px; border-radius:50%; border:2px solid rgba(255,255,255,.9);
    background:rgba(255,255,255,.55); font-size:18px; cursor:pointer; touch-action:manipulation;
    box-shadow:0 2px 6px rgba(50,80,120,.25);
  }
  #hud button:active, #hudR button:active { transform:scale(.92); }
  #hudR button.on { background:#ffd76e; border-color:#fff; box-shadow:0 2px 8px rgba(230,170,40,.55); }
  #hudR button.ad::after {
    content:'AD'; position:absolute; right:-5px; bottom:-4px;
    background:#ffcf3d; color:#7a5b00; font-size:9px; font-weight:800;
    padding:1px 4px; border-radius:6px; border:1px solid #fff; line-height:1.2;
  }
  #hudR button.ad::before {
    content:attr(data-count); position:absolute; left:-6px; top:-5px;
    min-width:17px; height:17px; box-sizing:border-box; padding:0 3px;
    background:#5fa8e8; color:#fff; font-size:10px; font-weight:800;
    border-radius:9px; border:1px solid #fff; line-height:15px; text-align:center;
  }
  #hudR button.ad.off { background:#f0736f; cursor:default; }
  #hudR button.ad.off::before { background:#c65550; }
  #hudR button.ad.off:active { transform:none; }

  .overlay {
    position:absolute; inset:0; display:flex; overflow-y:auto; border-radius:12px; line-height:normal;
    background:rgba(214,238,252,.92); backdrop-filter:blur(3px); z-index:10;
  }
  /* 다른 오버레이 위에 겹쳐 뜨는 레이어 (문서 순서와 무관하게 항상 위로) */
  #rank { z-index:20; }
  #adConfirm, #adPlay, #confirmDlg { z-index:30; }
  #nickEditor { z-index:40; }
  .overlay .sheet {
    margin:auto; display:flex; flex-direction:column; align-items:center;
    gap:14px; text-align:center; padding:24px 16px; width:100%;
  }
  .hidden { display:none !important; }
  .overlay h1 { font-size:clamp(24px, 9vmin, 38px); color:#5b4636; letter-spacing:1px; }
  .overlay h2 { font-size:clamp(20px, 7vmin, 30px); color:#5b4636; }
  .overlay p  { font-size:clamp(12px, 4vmin, 15px); color:#6b7480; line-height:1.5; }
  .overlay .big { font-size:clamp(18px, 6vmin, 26px); font-weight:800; color:#e0608a; }
  .overlay .sub { font-size:clamp(12px, 4vmin, 14px); color:#8a90a5; }
  .overlay button.mode, .overlay button.act {
    font-family:inherit; font-size:clamp(14px, 5vmin, 18px); font-weight:700; color:#fff; cursor:pointer;
    border:none; border-radius:999px; padding:12px 24px; min-width:min(230px, 82%);
    box-shadow:0 4px 0 rgba(0,0,0,.15); touch-action:manipulation;
  }
  .overlay button:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  button[data-mode="krw"] { background:#5fa8e8; }
  button[data-mode="usd"] { background:#67b984; }
  #btnAgain, #btnAdOk, #btnNickSave, #btnConfirmOk { background:#f78fb3; }
  #btnMenu, #btnAdCancel, #btnNickCancel, #btnConfirmCancel { background:#9aa5c4; }
  #btnRevive { background:#67b984; }

  .overlay .tip { font-size:12px; color:#8a90a5; }
  .chainBox { margin-top:2px; }
  .chainBox .cap { font-size:12px; font-weight:700; color:#8a90a5; margin-bottom:4px; }
  .chain { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3px; max-width:min(360px, 94vw); }
  .chain .arrow { font-size:11px; color:#b0b8cc; }
  .chain .coin, .chain .bill {
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:800; line-height:1;
  }
  .chain .coin { border-radius:50%; }
  .chain .bill { border-radius:4px; border-width:2px; border-style:solid; }

  /* ad dialogs */
  #adConfirmText, #confirmText { white-space:pre-line; }
  .overlay.dark { background:rgba(30,34,48,.9); }
  .overlay.dark p, .overlay.dark .sub { color:#c9d0e2; }
  #adBox {
    width:min(250px, 80%); height:140px; border-radius:14px;
    background:linear-gradient(135deg, #3b4460, #232a40);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; font-size:22px; font-weight:800; border:2px dashed rgba(255,255,255,.35);
  }
  #adBox .adSmall { font-size:12px; font-weight:600; color:#9aa5c4; letter-spacing:2px; }
  #adCount {
    width:52px; height:52px; border-radius:50%; background:#ffcf3d; color:#5b4400;
    font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:3px solid #fff;
  }

  /* ranking */
  #btnRank {
    position:absolute; top:calc(12px + var(--pill)); right:12px; width:46px; height:46px; border-radius:50%;
    border:2px solid #fff; background:#ffd76e; font-size:21px; cursor:pointer;
    box-shadow:0 3px 8px rgba(80,60,20,.25); touch-action:manipulation; z-index:1;
  }
  #btnRank:active { transform:scale(.92); }
  /* 헤더: ❮는 왼쪽 고정, 제목은 좌우 가운데 — 우상단이 비므로 토스 네이티브 ⋯/X와 겹칠 게 없음 */
  #rankPanel { display:flex; flex-direction:column; width:100%; height:100%; padding:12px 12px 8px; line-height:normal; }
  #rankHead { position:relative; display:flex; align-items:center; justify-content:center; min-height:36px; }
  #rankHead h2 { font-size:22px; color:#5b4636; }
  #btnRankClose {
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,.6);
    font-size:16px; color:#8a90a5; cursor:pointer; touch-action:manipulation;
  }
  #btnRankClose:active { transform:translateY(-50%) scale(.92); }
  /* 내 순위(왼쪽) · 닉네임(오른쪽) 한 줄 — 좁은 화면에서는 자연스럽게 줄바꿈 */
  #rankSub { display:flex; align-items:center; justify-content:space-between; gap:4px 10px; flex-wrap:wrap; margin-top:8px; }
  #rankMe { font-size:13px; color:#6b7480; }
  #rankMe b { color:#5b4636; }
  #rankMyPos { font-size:13px; color:#6b7480; }
  #rankMyPos b { color:#e0608a; }
  /* 닉네임 수정: 이모지 대신 텍스트 칩 (베이스라인 어긋남 없음) */
  .miniEdit {
    border:none; border-radius:999px; background:rgba(122,134,160,.16);
    color:#7a86a0; font-family:inherit; font-size:11px; font-weight:700;
    padding:3px 9px; margin-left:3px; vertical-align:1px;
    cursor:pointer; touch-action:manipulation;
  }
  .miniEdit:active { transform:scale(.94); }
  #nickInput {
    width:min(230px, 82%); font-family:inherit; font-size:16px; text-align:center;
    padding:11px 14px; border-radius:999px; border:2px solid #d9dfe5; outline:none; color:#5b4636;
  }
  #nickInput:focus { border-color:#f78fb3; }
  #rankTabs { display:flex; gap:6px; margin:10px 0; }
  #rankTabs button {
    flex:1; padding:9px 0; border-radius:999px; border:none; font-family:inherit;
    font-size:13px; font-weight:700; background:rgba(255,255,255,.6); color:#8a90a5;
    cursor:pointer; touch-action:manipulation;
  }
  #rankTabs button.active { background:#f78fb3; color:#fff; }
  #rankList { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:5px; padding-bottom:6px; }
  .rankMsg { text-align:center; color:#8a90a5; padding:34px 0; font-size:14px; }
  .rankCap { text-align:center; font-size:12px; color:#8a90a5; margin:2px 0; }
  .rankRow {
    display:flex; align-items:center; gap:8px; flex:none;
    background:rgba(255,255,255,.55); border-radius:10px; padding:7px 10px;
    font-size:13px; color:#5a617a;
  }
  .rankRow .no { width:36px; text-align:center; font-weight:800; flex:none; }
  .rankRow .nick { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .rankRow .pts { font-weight:800; color:#e0608a; flex:none; }
  .rankRow.hot { background:rgba(255,228,140,.6); border:1.5px solid rgba(222,178,74,.55); }
  /* 내 기록 강조 — outline은 둥근 모서리를 따라가지 않아 카드 밖으로 삐져나옴 */
  .rankRow.me { box-shadow:0 0 0 2px #5fa8e8; }
  /* 1~3위 카드는 금/은/동 스타일이 이미 뚜렷하므로 파란 링 생략 */
  .rankRow.t1.me, .rankRow.t2.me, .rankRow.t3.me { box-shadow:none; }
  .rankRow.t1 { background:linear-gradient(90deg,#ffe9a8,#f7d874); border:1.5px solid #d9b24a; font-size:15px; padding:11px 10px; }
  .rankRow.t2 { background:linear-gradient(90deg,#eef2f5,#d9dfe5); border:1.5px solid #aab2ba; font-size:14px; padding:10px; }
  .rankRow.t3 { background:linear-gradient(90deg,#f2d3b3,#e5b98d); border:1.5px solid #c08552; font-size:14px; padding:10px; }
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:8px 4px 12px; flex:none; }
  .pCol { flex:1; max-width:112px; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
  .pCol .pMedal { font-size:27px; }
  .pCol .pNick { font-size:12px; font-weight:700; color:#5a617a; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pCol .pPts { font-size:11px; font-weight:800; color:#e0608a; }
  .pCol .pBlock {
    width:100%; border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .pCol.first  .pBlock { height:88px; background:linear-gradient(#f7d874,#d9a93a); }
  .pCol.second .pBlock { height:64px; background:linear-gradient(#dde3e8,#a9b2bc); }
  .pCol.third  .pBlock { height:50px; background:linear-gradient(#e8bd8f,#bd8250); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <button id="btnMute" title="소리">🔊</button>
      <button id="btnHome" title="처음으로">🏠</button>
      <button id="btnRestart" title="다시하기">🔄</button>
    </div>

    <div id="hudR" class="hidden">
      <button id="btnAuto" title="자동 드롭 — 켜고 꾹 누르고 있으면 계속 떨어져요">⚡</button>
      <button id="btnFill" title="자동 진행 (공간 4/5까지 동전 자동 투하)">⏩</button>
      <button id="btnShake" class="ad" title="통 흔들기 (광고)">🌀</button>
      <button id="btnClean" class="ad" title="동전 제거 (광고)">🧹</button>
    </div>

    <div id="menu" class="overlay">
      <button id="btnRank" title="랭킹">🏆</button>
      <div class="sheet">
        <h1>💰 머니 게임</h1>
        <p>같은 돈끼리 부딪히면 더 큰 돈이 돼요!<br>돈을 떨어뜨려서 제일 큰 돈을 만들어 보세요.</p>
        <button class="mode" data-mode="krw">▶️ 게임시작</button>
        <div class="chainBox"><div class="cap">돈 불리는 순서</div><div class="chain" id="chainKrw"></div></div>
        <p class="tip" id="comboTip"></p>
      </div>
    </div>

    <div id="over" class="overlay hidden">
      <div class="sheet">
        <h2>😵 게임 오버!</h2>
        <div class="sub">모은 돈</div>
        <div class="big" id="finalScore"></div>
        <div class="sub" id="finalBest"></div>
        <div class="sub">닉네임: <b id="finalNickName"></b> <button class="miniEdit" id="btnEditNick2" title="닉네임 수정">수정</button></div>
        <button class="act" id="btnRevive">📺 광고 보고 부활 (동전 제거)</button>
        <button class="act" id="btnAgain">다시하기</button>
        <button class="act" id="btnMenu">처음으로</button>
      </div>
    </div>

    <div id="adConfirm" class="overlay hidden">
      <div class="sheet">
        <h2>📺 광고 보기</h2>
        <p id="adConfirmText"></p>
        <button class="act" id="btnAdOk">광고 보고 사용하기</button>
        <button class="act" id="btnAdCancel">취소</button>
      </div>
    </div>

    <div id="adPlay" class="overlay dark hidden">
      <div class="sheet">
        <div id="adBox">📺 테스트 광고<span class="adSmall">TEST AD</span></div>
        <div id="adCount">3</div>
        <p class="sub" id="adPlayMsg">잠시 후 기능이 실행됩니다…</p>
      </div>
    </div>

    <div id="confirmDlg" class="overlay hidden">
      <div class="sheet">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
        <button class="act" id="btnConfirmOk">네</button>
        <button class="act" id="btnConfirmCancel">계속 할래요</button>
      </div>
    </div>

    <div id="nickEditor" class="overlay hidden">
      <div class="sheet">
        <h2>✏️ 닉네임 설정</h2>
        <p>랭킹에 표시될 이름을 정해주세요</p>
        <input id="nickInput" type="text" maxlength="10" placeholder="닉네임 입력 (최대 10자)" autocomplete="off">
        <button class="act" id="btnNickSave">저장</button>
        <button class="act" id="btnNickCancel">취소</button>
      </div>
    </div>

    <div id="rank" class="overlay hidden">
      <div id="rankPanel">
        <div id="rankHead">
          <button id="btnRankClose" title="뒤로">❮</button>
          <h2>랭킹</h2>
        </div>
        <div id="rankSub">
          <div id="rankMyPos"></div>
          <div id="rankMe">닉네임: <b id="rankMeName"></b> <button class="miniEdit" id="btnEditNick1" title="닉네임 수정">수정</button></div>
        </div>
        <div id="rankTabs">
          <button data-tab="week" class="active">이번주</button>
          <button data-tab="month">이번달</button>
          <button data-tab="hall">명예의전당</button>
        </div>
        <div id="rankList"></div>
      </div>
    </div>
    </div><!-- /gameArea -->

    <div id="adBanner">AD · 배너 광고 영역 (320×50)</div>
  </div>

  <script src="lib/matter.min.js"></script>
  <script src="lib/supabase.min.js"></script>
  <script src="lib/apps-in-toss.min.js"></script>
  <script src="js/toss-safearea.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/toss-ads.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
